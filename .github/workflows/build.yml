name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -q TapShare.zip -d src
      - name: Fix layout namespace
        run: sed -i '0,/xmlns:android="http:\/\/schemas.android.com\/apk\/res\/android"/s||xmlns:android="http://schemas.android.com/apk/res/android" xmlns:app="http://schemas.android.com/apk/res-auto"|' src/TapShare/app/src/main/res/layout/activity_main.xml
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build debug APK
        working-directory: src/TapShare
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: tapshare-debug-apk
          path: src/TapShare/app/build/outputs/apk/debug/app-debug.apk
